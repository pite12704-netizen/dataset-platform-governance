name: isolated-validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated dependencies
        run: |
          python -m venv .venv-cloud
          .venv-cloud/bin/python -m pip install --require-hashes -r backend/requirements.lock
          npm --prefix frontend ci
      - name: Validate without owner services
        run: |
          export DP_TEST_BROWSER_EXE="$(command -v google-chrome || command -v chromium)"
          test -x "$DP_TEST_BROWSER_EXE"
          bash scripts/check-cloud.sh
      - name: Verify public source and history
        run: |
          .venv-cloud/bin/python scripts/audit_repository.py
          .venv-cloud/bin/python scripts/audit_git_history.py
          .venv-cloud/bin/python scripts/public_release.py check
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Audit pinned Python packages and generate CycloneDX
        run: |
          python -m venv .venv-audit
          .venv-audit/bin/python -m pip install pip-audit==2.9.0
          mkdir -p var/ci
          .venv-audit/bin/python -m pip_audit --disable-pip --no-deps -r backend/requirements.lock -f cyclonedx-json -o var/ci/backend.cdx.json
      - name: Audit frontend lock and generate CycloneDX
        if: ${{ !cancelled() }}
        run: |
          mkdir -p var/ci
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend sbom --sbom-format cyclonedx > var/ci/frontend.cdx.json
          npm --prefix frontend audit --audit-level=high
      - name: Retain only dependency reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-evidence
          path: var/ci/*.cdx.json
          retention-days: 14
          if-no-files-found: warn
